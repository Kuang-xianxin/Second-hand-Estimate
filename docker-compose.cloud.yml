version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    container_name: guessr-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BACKEND_PORT=8000
      - FRONTEND_URL=${FRONTEND_URL}
      - CRAWL_ENABLED=${CRAWL_ENABLED:-true}
      - INITIAL_CRAWL_ENABLED=${INITIAL_CRAWL_ENABLED:-false}
      - CRAWL_INTERVAL_SECONDS=${CRAWL_INTERVAL_SECONDS:-5400}
      - MAX_ITEMS_PER_QUERY=${MAX_ITEMS_PER_QUERY:-200}
      - MAX_PAGES_PER_QUERY=${MAX_PAGES_PER_QUERY:-2}
      - CRAWL_CONCURRENCY=${CRAWL_CONCURRENCY:-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./backend/data:/app/data
