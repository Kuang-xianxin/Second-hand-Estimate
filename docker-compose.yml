version: "3.8"

# 估二手 — full stack for AI Advisor
# Usage: docker compose up -d

services:
  # ── Qdrant vector database (Phase 2: RAG) ──
  qdrant:
    image: qdrant/qdrant:v1.10
    container_name: guessr-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Redis (cache + Celery broker) ──
  redis:
    image: redis:7-alpine
    container_name: guessr-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ── PostgreSQL (Phase 1: structured data) ──
  postgres:
    image: postgres:16-alpine
    container_name: guessr-postgres
    environment:
      POSTGRES_USER: ccd_user
      POSTGRES_PASSWORD: ccd_dev_password
      POSTGRES_DB: ccd_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Celery worker (async tasks) ──
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guessr-celery
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://ccd_user:ccd_dev_password@postgres:5432/ccd_db
      CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ── Backend API (FastAPI) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guessr-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ccd_user:ccd_dev_password@postgres:5432/ccd_db
      CELERY_BROKER_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  pg_data:
